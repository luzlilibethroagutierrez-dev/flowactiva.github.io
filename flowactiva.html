<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Flow Activa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333333;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #1a1a2e;
        color: white;
        padding: 20px 40px;
      }
      header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 2px;
      }
      header p {
        margin: 4px 0 0;
        color: #a0c4ff;
        font-size: 14px;
      }
      main {
        padding: 40px;
      }
      h2 {
        color: #1a1a2e;
        border-bottom: 2px solid #a0c4ff;
        padding-bottom: 6px;
      }
      .productos {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .tarjeta {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        width: 200px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
      }
      .tarjeta img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 6px;
      }
      .tarjeta h3 {
        margin: 12px 0 4px;
        font-size: 15px;
        color: #1a1a2e;
      }
      .tarjeta .precio {
        color: #a0c4ff;
        font-weight: bold;
        font-size: 16px;
      }
      .tarjeta .boton {
        display: inline-block;
        background-color: #1a1a2e;
        color: white;
        padding: 8px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 13px;
        margin-top: 12px;
      }
      footer {
        background-color: #1a1a2e;
        color: #a0c4ff;
        text-align: center;
        padding: 20px;
        margin-top: 60px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>

    <header>
      <h1>Flow Activa</h1>
      <p>Vístete en movimiento</p>
    </header>

    <main>
      <h2>Nuestros productos</h2>
      <p>Ropa deportiva de calidad para tu estilo de vida activo.</p>

      <div class="productos">

        <div class="tarjeta">
          <img src="imagen3.jpg" alt="Conjunto deportivo">
          <h3>Conjunto deportivo</h3>
          <p class="precio">$85.000</p>
          <a class="boton" href="https://wa.me/573125381152?text=Hola%20Flow%20Activa%2C%20quiero%20el%20Conjunto%20deportivo%20%2485.000">Pedir</a>
        </div>

        <div class="tarjeta">
          <img src="imagen2.jpg" alt="Leggins premium">
          <h3>Leggins premium</h3>
          <p class="precio">$45.000</p>
          <a class="boton" href="https://wa.me/573125381152?text=Hola%20Flow%20Activa%2C%20quiero%20los%20Leggins%20premium%20%2445.000">Pedir</a>
        </div>

        <div class="tarjeta">
          <img src="img1.jpg" alt="Top deportivo">
          <h3>Top deportivo</h3>
          <p class="precio">$38.000</p>
          <a class="boton" href="https://wa.me/573125381152?text=Hola%20Flow%20Activa%2C%20quiero%20el%20Top%20deportivo%20%2438.000">Pedir</a>
        </div>

      </div>
    </main>

    <footer>
      <p>© 2026 Flow Activa — @flowactiva</p>
      <p>Cúcuta, Colombia</p>
    </footer>

  </body>
</html>
